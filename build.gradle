plugins {
    id 'java'
}

group = 'com.aguilam'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
}

dependencies {
    compileOnly fileTree(dir: 'libs/neoforge', include: '*.jar')
    compileOnly files(
            'libs/recruits-1.21.1-1.15.2.jar',
            'libs/cloth-config-15.0.140-neoforge.jar'
    )
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "recruitupgrades",
                "Specification-Vendor"    : "aguilam",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "aguilam",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
